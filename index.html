<!DOCTYPE html>

    html, body {

      padding: 0;
      border-radius: 50%;

    }

    .start-orb-btn img {

    .pass-modal-card {

      background: linear-gradient(165deg, #102447 0%, #070e1c 100%);
      border: 1.5px solid rgba(56, 189, 248, 0.65);
      border-radius: 20px;
      padding: 18px;

    .pass-modal-top {

    .pass-modal-brand {

    .pass-modal-brand img {

    .pass-title {

    .w-violet-green { background: conic-gradient(#9333ea 0deg 180deg, #16a34a 180deg 360deg); }
    .w-violet-red { background: conic-gradient(#9333ea 0deg 180deg, #dc2626 180deg 360deg); }

    .popup-footer {

    .popup-footer button {
      background: none;
      border: none;
      color: #fde047;
      font-size: 9.5px;
      font-weight: 800;
      cursor: pointer;
      padding: 0;
    }
  </style>

<body>

  <!-- শুরুতে স্ক্রিনে ভাসমান গোলাকার আইকন ছবি (মুভেবল + ট্যাপ করলে পাসওয়ার্ড বক্স) -->

  <!-- মূল ভাসমান হ্যাক পপআপ কার্ড (ড্র্যাগেবল) -->
  <div class="hack-popup" id="hackPopup">
    <div class="popup-top-bar" id="dragHandle">

          src="https://cdn.imageurlgenerator.com/uploads/49641014-9dfb-440e-ae20-83044883b063.jpg"

        />
        <div class="popup-badge-txt">PLAY<br />SMARTER</div>

      <div class="popup-header-center">

      <button type="button" class="mode-pill active" data-mode="30S">30S</button>

  </div>

  <script>
    const ACCESS_PASS = "Zahirul22369";
    const REFERRAL_URL = "https://dkwin9.com/#/register?invitationCode=932152417441";

    const MODES = {
      "30S": { duration: 30,  offset: 50000, label: "30 SEC PREDICTOR V2" },
      "1M":  { duration: 60,  offset: 20000, label: "1 MIN PREDICTOR V2" },
      "3M":  { duration: 180, offset: 10000, label: "3 MIN PREDICTOR V2" },
      "5M":  { duration: 300, offset: 5000,  label: "5 MIN PREDICTOR V2" }
    };

    let currentMode = "30S";

    const startOrbBtn = document.getElementById("startOrbBtn");
    const passModal = document.getElementById("passModal");
    const closePassBtn = document.getElementById("closePassBtn");
    const passInput = document.getElementById("passInput");
    const unlockBtn = document.getElementById("unlockBtn");
    const errorMsg = document.getElementById("errorMsg");
    const hackPopup = document.getElementById("hackPopup");
    const hideBtn = document.getElementById("hideBtn");
    const goRegisterBtn = document.getElementById("goRegisterBtn");
    const copyRefBtn = document.getElementById("copyRefBtn");
    const popupRegBtn = document.getElementById("popupRegBtn");

    function openRegistrationPage() {
      try {
        if (window.top && window.top !== window) {
          window.top.location.href = REFERRAL_URL;
        } else {
          window.location.href = REFERRAL_URL;
        }
      } catch (_) {
        window.location.assign(REFERRAL_URL);
      }
    }

    goRegisterBtn.addEventListener("click", openRegistrationPage);
    popupRegBtn.addEventListener("click", openRegistrationPage);

    copyRefBtn.addEventListener("click", () => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(REFERRAL_URL).catch(() => {});
      }
      copyRefBtn.textContent = "COPIED";
      setTimeout(() => {
        copyRefBtn.textContent = "COPY";
      }, 1500);
    });

    function openPasswordBox() {
      errorMsg.textContent = "";
      passInput.value = "";
      passModal.style.display = "flex";
      setTimeout(() => passInput.focus(), 60);
    }

    closePassBtn.addEventListener("click", () => {
      passModal.style.display = "none";
    });

    function unlockPopup() {
      const entered = passInput.value.trim();
      if (entered === ACCESS_PASS) {
        errorMsg.textContent = "";
        passModal.style.display = "none";
        startOrbBtn.style.display = "none";
        hackPopup.style.display = "block";
        syncAll();
      } else {
        errorMsg.textContent = "ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।";
      }
    }

    unlockBtn.addEventListener("click", unlockPopup);
    passInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") unlockPopup();
    });

    hideBtn.addEventListener("click", () => {
      hackPopup.style.display = "none";
      startOrbBtn.style.display = "flex";
    });

    document.querySelectorAll(".mode-pill").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".mode-pill").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        document.getElementById("modeSubtitle").textContent = MODES[currentMode].label;
        syncAll();
      });
    });

    function computePeriodInfo(modeKey) {
      const cfg = MODES[modeKey];
      const now = new Date();
      const utcSecToday = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
      const elapsed = utcSecToday % cfg.duration;
      const indexToday = Math.floor(utcSecToday / cfg.duration) + 1;
      const timeLeft = cfg.duration - elapsed;

      const yyyy = now.getUTCFullYear();
      const mm = String(now.getUTCMonth() + 1).padStart(2, "0");
      const dd = String(now.getUTCDate()).padStart(2, "0");
      const seq = String(cfg.offset + indexToday).padStart(5, "0");
      const period = `${yyyy}${mm}${dd}1000${seq}`;

      return { period, timeLeft, indexToday, yyyy, mm, dd, offset: cfg.offset };
    }

    function computeSignalForPeriod(periodStr, slotIndex) {
      const tail = parseInt(periodStr.slice(-5), 10) || 12345;
      const trend = (tail * 31 + slotIndex) % 100;
      const isBig = trend >= 46;
      const num = isBig
        ? 5 + ((tail + slotIndex) % 5)
        : (tail + slotIndex) % 5;

      let colorName = "RED";
      let orbClass = "orb-red";
      let wheelClass = "w-red";

      if (num === 0) {
        colorName = "VIOLET + RED";
        orbClass = "orb-violet";
        wheelClass = "w-violet-red";
      } else if (num === 5) {
        colorName = "VIOLET + GREEN";
        orbClass = "orb-violet";
        wheelClass = "w-violet-green";
      } else if ([1, 3, 7, 9].includes(num)) {
        colorName = "GREEN";
        orbClass = "orb-green";
        wheelClass = "w-green";
      }

      return { isBig, num, colorName, orbClass, wheelClass };
    }

    function renderRecentWheels(info) {
      const container = document.getElementById("recentBubbles");
      container.innerHTML = "";
      for (let i = 9; i >= 0; i--) {
        const pastIdx = Math.max(1, info.indexToday - i);
        const seq = String(info.offset + pastIdx).padStart(5, "0");
        const pStr = `${info.yyyy}${info.mm}${info.dd}1000${seq}`;
        const sig = computeSignalForPeriod(pStr, pastIdx);

        const el = document.createElement("div");
        el.className = `mini-wheel ${sig.wheelClass}`;
        el.textContent = String(sig.num);
        container.appendChild(el);
      }
    }

    function syncAll() {
      const info = computePeriodInfo(currentMode);
      const sig = computeSignalForPeriod(info.period, info.indexToday);

      document.getElementById("popupPeriod").textContent = info.period;
      document.getElementById("nextInLabel").textContent = `NEXT IN ${String(info.timeLeft).padStart(2, "0")}s`;

      const orb = document.getElementById("mainOrb");
      orb.textContent = String(sig.num);
      orb.className = `glow-orb ${sig.orbClass}`;
      document.getElementById("colorTag").textContent = sig.colorName;

      const smallCard = document.getElementById("smallCard");
      const bigCard = document.getElementById("bigCard");
      const smallStatus = document.getElementById("smallStatus");
      const bigStatus = document.getElementById("bigStatus");

      if (sig.isBig) {
        bigCard.classList.add("active-pick");
        smallCard.classList.remove("active-pick");
        bigStatus.textContent = "PREDICTED";
        bigStatus.className = "side-status-pill picked";
        smallStatus.textContent = "SKIP";
        smallStatus.className = "side-status-pill";
      } else {
        smallCard.classList.add("active-pick");
        bigCard.classList.remove("active-pick");
        smallStatus.textContent = "PREDICTED";
        smallStatus.className = "side-status-pill picked";
        bigStatus.textContent = "SKIP";
        bigStatus.className = "side-status-pill";
      }

      renderRecentWheels(info);
    }

    function enableFreeDrag(targetEl, handleEl, onTapCallback = null) {
      let isDown = false;
      let hasMoved = false;
      let startX = 0;
      let startY = 0;
      let origLeft = 0;
      let origTop = 0;

      function beginDrag(x, y) {
        const rect = targetEl.getBoundingClientRect();
        origLeft = rect.left;
        origTop = rect.top;
        startX = x;
        startY = y;
        isDown = true;
        hasMoved = false;
        targetEl.style.left = `${origLeft}px`;
        targetEl.style.top = `${origTop}px`;
        targetEl.style.right = "auto";
        targetEl.style.bottom = "auto";
        targetEl.style.transform = "none";
      }

      function moveDrag(x, y) {
        if (!isDown) return;
        const dx = x - startX;
        const dy = y - startY;
        if (Math.hypot(dx, dy) > 6) {
          hasMoved = true;
        }
        const maxLeft = Math.max(4, window.innerWidth - targetEl.offsetWidth - 4);
        const maxTop = Math.max(4, window.innerHeight - targetEl.offsetHeight - 4);
        const nextLeft = Math.max(4, Math.min(maxLeft, origLeft + dx));
        const nextTop = Math.max(4, Math.min(maxTop, origTop + dy));
        targetEl.style.left = `${nextLeft}px`;
        targetEl.style.top = `${nextTop}px`;
      }

      function endDrag() {
        if (!isDown) return;
        isDown = false;
        if (!hasMoved && typeof onTapCallback === "function") {
          onTapCallback();
        }
      }

      handleEl.addEventListener("touchstart", (e) => {
        if (e.target.closest("button") || e.target.closest("a")) return;
        if (e.touches.length === 1) {
          beginDrag(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      handleEl.addEventListener("touchmove", (e) => {
        if (!isDown || e.touches.length !== 1) return;
        e.preventDefault();
        moveDrag(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });

      handleEl.addEventListener("touchend", endDrag);
      handleEl.addEventListener("touchcancel", endDrag);

      handleEl.addEventListener("mousedown", (e) => {
        if (e.button !== 0 || e.target.closest("button") || e.target.closest("a")) return;
        beginDrag(e.clientX, e.clientY);

        function onMouseMove(ev) {
          moveDrag(ev.clientX, ev.clientY);
        }

        function onMouseUp() {
          document.removeEventListener("mousemove", onMouseMove);
          document.removeEventListener("mouseup", onMouseUp);
          endDrag();
        }

        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      });
    }

    enableFreeDrag(startOrbBtn, startOrbBtn, openPasswordBox);
    enableFreeDrag(hackPopup, document.getElementById("dragHandle"));

    setInterval(syncAll, 1000);
    syncAll();
  </script>
</body>
