<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PATOWARI'S HACK - 3D Wing VIP Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #02050c;
            color: #ffffff;
        }

        #game-iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* কমন 3D টেক্সট স্টাইল */
        .text-3d {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            text-shadow:
                0 1px 0 #091326,
                0 2px 0 #050a14,
                0 3px 6px rgba(0, 0, 0, 0.95),
                0 0 10px rgba(56, 189, 248, 0.45);
        }

        /* বড় 3D ডানা (Left & Right Wings) */
        .wing-pair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: -1;
        }

        .wing-3d {
            position: absolute;
            top: 50%;
            transform-origin: center center;
            filter:
                drop-shadow(0 6px 12px rgba(0, 0, 0, 0.92))
                drop-shadow(0 0 14px rgba(56, 189, 248, 0.55));
        }

        .wing-left {
            right: 100%;
            margin-right: -4px;
            transform: translateY(-52%) rotateY(18deg);
            animation: flapLeftWing 2.2s ease-in-out infinite;
        }

        .wing-right {
            left: 100%;
            margin-left: -4px;
            transform: translateY(-52%) rotateY(-18deg);
            animation: flapRightWing 2.2s ease-in-out infinite;
        }

        @keyframes flapLeftWing {
            0%, 100% { transform: translateY(-52%) rotate(-6deg) scaleX(1); }
            50%      { transform: translateY(-58%) rotate(11deg) scaleX(1.06); }
        }

        @keyframes flapRightWing {
            0%, 100% { transform: translateY(-52%) rotate(6deg) scaleX(1); }
            50%      { transform: translateY(-58%) rotate(-11deg) scaleX(1.06); }
        }

        /* ৩ডি ফ্লোটিং আইকন + বড় ডানা */
        #floating-icon-btn {
            position: fixed;
            top: 86px;
            right: 46px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2.5px solid #fde047;
            box-shadow:
                0 0 0 2px #ef4444,
                0 10px 24px rgba(0, 0, 0, 0.95),
                0 0 22px rgba(250, 204, 21, 0.8),
                inset 0 2px 6px rgba(255, 255, 255, 0.45);
            cursor: grab;
            z-index: 9999;
            overflow: visible;
            touch-action: none;
            background: radial-gradient(circle at 30% 25%, #2563eb, #050a14);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.16s ease;
        }

        #floating-icon-btn:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .icon-circle-clip {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #floating-icon-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* পাসওয়ার্ড পপআপ */
        #auth-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 236px;
            background: linear-gradient(155deg, rgba(26, 58, 118, 0.99) 0%, rgba(7, 15, 32, 0.99) 60%, rgba(3, 7, 16, 1) 100%);
            border: 1.5px solid rgba(250, 204, 21, 0.9);
            border-radius: 17px;
            box-shadow:
                0 22px 44px rgba(0, 0, 0, 0.95),
                0 0 26px rgba(56, 189, 248, 0.32),
                inset 0 1px 1px rgba(255, 255, 255, 0.32);
            padding: 13px;
            display: none;
            z-index: 10000;
            text-align: center;
            backdrop-filter: blur(12px);
        }

        .auth-title {
            font-size: 12px;
            background: linear-gradient(90deg, #fef08a, #38bdf8, #4ade80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 0.7px;
        }

        .auth-input {
            width: 100%;
            padding: 7px 9px;
            background: rgba(3, 8, 18, 0.94);
            border: 1px solid rgba(56, 189, 248, 0.78);
            border-radius: 8px;
            color: #ffffff;
            font-size: 11px;
            text-align: center;
            margin-bottom: 8px;
            outline: none;
            font-weight: 700;
            user-select: text;
            -webkit-user-select: text;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 9px;
            color: #cbd5e1;
            margin-bottom: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-btn {
            width: 100%;
            padding: 7px;
            background: linear-gradient(135deg, #fef08a 0%, #facc15 50%, #eab308 100%);
            border: none;
            border-radius: 8px;
            color: #050912;
            font-size: 10.5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            box-shadow: 0 4px 14px rgba(250, 204, 21, 0.45);
        }

        #error-msg {
            color: #fb7185;
            font-size: 9px;
            margin-top: 6px;
            display: none;
            font-weight: 700;
        }

        /* গর্জিয়াস ৩ডি VIP পপআপ কার্ড + বড় 3D ডানা */
        .overlay-box {
            position: fixed;
            top: 108px;
            left: 56px;
            width: 224px;
            max-width: calc(100vw - 110px);
            display: none;
            z-index: 9999;
            background:
                radial-gradient(circle at 50% -15%, rgba(56, 189, 248, 0.4) 0%, transparent 56%),
                radial-gradient(circle at 8% 100%, rgba(239, 68, 68, 0.24) 0%, transparent 55%),
                radial-gradient(circle at 92% 100%, rgba(34, 197, 94, 0.24) 0%, transparent 55%),
                linear-gradient(170deg, #152e5c 0%, #071226 52%, #030712 100%);
            border-radius: 18px;
            padding: 7.5px;
            box-shadow:
                0 20px 42px rgba(0, 0, 0, 0.96),
                0 0 24px rgba(56, 189, 248, 0.42),
                0 0 14px rgba(250, 204, 21, 0.25),
                inset 0 1px 1.5px rgba(255, 255, 255, 0.36);
            border: 1.5px solid rgba(125, 211, 252, 0.85);
            backdrop-filter: blur(12px);
        }

        .popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3px;
            margin-bottom: 5px;
            cursor: grab;
            touch-action: none;
            padding-bottom: 3.5px;
            border-bottom: 1px solid rgba(250, 204, 21, 0.24);
        }

        .popup-header:active {
            cursor: grabbing;
        }

        .badge-left {
            background: linear-gradient(135deg, #fde047 0%, #4ade80 55%, #16a34a 100%);
            color: #042812;
            font-size: 6.5px;
            padding: 2px 4px;
            border-radius: 5px;
            line-height: 1.05;
            text-transform: uppercase;
            pointer-events: none;
            text-shadow: none;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.55);
        }

        .brand-center {
            text-align: center;
            flex: 1;
            pointer-events: none;
        }

        .brand-main {
            font-style: italic;
            font-size: 10.5px;
            letter-spacing: 0.4px;
            background: linear-gradient(90deg, #fef08a, #38bdf8, #f87171, #4ade80, #fef08a);
            background-size: 260% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            animation: titleShimmer 3.2s linear infinite;
        }

        @keyframes titleShimmer {
            0%   { background-position: 0% 50%; }
            100% { background-position: 260% 50%; }
        }

        .brand-sub {
            font-size: 6.2px;
            color: #fde047;
            letter-spacing: 0.3px;
            margin-top: 1px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 2.5px;
        }

        /* বাংলা ভয়েস ON / OFF বাটন */
        .voice-toggle-btn {
            font-size: 6.2px;
            padding: 2px 4.5px;
            border-radius: 5px;
            border: 1px solid rgba(74, 222, 128, 0.75);
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: #052e16;
            cursor: pointer;
            text-shadow: none;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.45);
            transition: all 0.15s ease;
        }

        .voice-toggle-btn.is-off {
            background: linear-gradient(135deg, #334155, #0f172a);
            color: #fca5a5;
            border-color: rgba(248, 113, 113, 0.55);
            box-shadow: none;
        }

        .hide-btn {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
            color: #f8fafc;
            border: 1px solid rgba(125, 211, 252, 0.55);
            padding: 2px 4.5px;
            border-radius: 5px;
            font-size: 6.2px;
            cursor: pointer;
        }

        /* ৪টি মার্কেট ট্যাব */
        .market-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2.5px;
            margin-bottom: 5.5px;
            background: rgba(3, 7, 16, 0.95);
            padding: 2.5px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.38);
        }

        .market-btn {
            font-size: 7px;
            padding: 2.8px 1px;
            border-radius: 5.5px;
            border: 1px solid transparent;
            background: rgba(15, 23, 42, 0.88);
            color: #cbd5e1;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }

        .market-btn.active {
            background: linear-gradient(135deg, #ef4444 0%, #facc15 50%, #2563eb 100%);
            color: #050912;
            border-color: #ffffff;
            text-shadow: none;
            box-shadow: 0 0 11px rgba(250, 204, 21, 0.5);
        }

        /* বামে SMALL, মাঝে PERIOD + FOOTBALL-RACK ORB, ডানে BIG */
        .pred-grid {
            display: grid;
            grid-template-columns: 0.9fr 1.32fr 0.9fr;
            gap: 4px;
            align-items: stretch;
            position: relative;
        }

        .side-panel {
            border-radius: 11px;
            padding: 5.5px 3px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.25);
            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .panel-small {
            background: linear-gradient(165deg, rgba(14, 165, 233, 0.52) 0%, rgba(8, 47, 73, 0.95) 60%, rgba(4, 20, 36, 0.98) 100%);
        }

        .panel-big {
            background: linear-gradient(165deg, rgba(236, 72, 153, 0.52) 0%, rgba(80, 7, 36, 0.95) 60%, rgba(36, 3, 18, 0.98) 100%);
        }

        .side-panel.is-predicted {
            border-color: #4ade80;
            transform: translateY(-1px) scale(1.02);
            box-shadow:
                0 0 16px rgba(74, 222, 128, 0.6),
                0 8px 16px rgba(0, 0, 0, 0.78),
                inset 0 1px 2px rgba(255, 255, 255, 0.42);
        }

        .side-panel > div {
            position: relative;
            z-index: 2;
        }

        /* নিচ থেকে উপরের দিকে ছুটে যাওয়া রকেট */
        .firecracker-rocket {
            position: absolute;
            left: 50%;
            bottom: 3px;
            width: 3px;
            height: 11px;
            border-radius: 999px;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #ffffff 0%, #38bdf8 50%, #f472b6 100%);
            box-shadow: 0 0 8px #38bdf8, 0 0 15px #f472b6;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            animation: rocketAscendBlast 2.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        }

        .panel-big .firecracker-rocket {
            animation-delay: 1.05s;
        }

        @keyframes rocketAscendBlast {
            0%   { opacity: 0; bottom: 2px; height: 9px; transform: translateX(-50%) scale(0.9); }
            12%  { opacity: 1; bottom: 8px; height: 12px; transform: translateX(-50%) scale(1); }
            62%  { opacity: 1; bottom: calc(100% - 17px); height: 7px; transform: translateX(-50%) scale(1.05); }
            67%  { opacity: 0; bottom: calc(100% - 14px); height: 2px; transform: translateX(-50%) scale(0.4); }
            100% { opacity: 0; bottom: 2px; height: 9px; transform: translateX(-50%) scale(0.9); }
        }

        .firecracker-burst {
            position: absolute;
            left: 50%;
            top: 13px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.15);
            background: radial-gradient(circle, #ffffff 0%, #38bdf8 38%, #f472b6 70%, transparent 100%);
            box-shadow:
                0 0 14px #ffffff,
                0 0 24px #38bdf8,
                -11px -9px 6px #facc15,
                11px -9px 6px #38bdf8,
                -13px 2px 6px #f472b6,
                13px 2px 6px #4ade80,
                -8px 10px 6px #38bdf8,
                8px 10px 6px #facc15,
                0 -13px 6px #ffffff,
                0 12px 6px #f472b6;
            opacity: 0;
            pointer-events: none;
            z-index: 4;
            animation: thashLightScatter 2.1s ease-out infinite;
        }

        .panel-big .firecracker-burst {
            animation-delay: 1.05s;
        }

        @keyframes thashLightScatter {
            0%, 64% { opacity: 0; transform: translate(-50%, -50%) scale(0.15); }
            68%       { opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
            82%       { opacity: 0.9; transform: translate(-50%, -50%) scale(1.85); }
            100%      { opacity: 0; transform: translate(-50%, -50%) scale(2.35); }
        }

        .firecracker-sparks {
            position: absolute;
            left: 50%;
            top: 13px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.1);
            box-shadow:
                -16px -4px 4px #facc15,
                16px -4px 4px #38bdf8,
                -6px -14px 4px #f472b6,
                6px -14px 4px #4ade80,
                -12px 7px 4px #38bdf8,
                12px 7px 4px #facc15,
                -4px 14px 4px #f472b6,
                4px 14px 4px #4ade80;
            opacity: 0;
            pointer-events: none;
            z-index: 4;
            animation: sparkOuterSpray 2.1s ease-out infinite;
        }

        .panel-big .firecracker-sparks {
            animation-delay: 1.05s;
        }

        @keyframes sparkOuterSpray {
            0%, 65% { opacity: 0; transform: translate(-50%, -50%) scale(0.1); }
            71%       { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            88%       { opacity: 0.65; transform: translate(-50%, -50%) scale(1.75); }
            100%      { opacity: 0; transform: translate(-50%, -50%) scale(2.15); }
        }

        /* 3D SMALL ও BIG নাম */
        .panel-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.5px;
            line-height: 1.1;
            transform: perspective(180px) rotateX(10deg);
            background: linear-gradient(90deg, #ff2a85, #fee440, #00f5d4, #9b5de5, #ff2a85);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 0.4px rgba(255, 255, 255, 0.35);
            filter:
                drop-shadow(0 1.5px 0px #09152b)
                drop-shadow(0 3px 0px rgba(0, 0, 0, 0.9))
                drop-shadow(0 0 7px rgba(0, 245, 212, 0.55));
            animation: rgbTextFlow 2.5s linear infinite;
        }

        @keyframes rgbTextFlow {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .panel-range {
            font-size: 7px;
            color: #e2e8f0;
            opacity: 0.92;
            margin-top: 1.5px;
        }

        .panel-tag {
            margin-top: 5px;
            font-size: 6px;
            padding: 2px 2px;
            border-radius: 4.5px;
            background: rgba(15, 23, 42, 0.92);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.15);
        }

        .panel-tag.active-tag {
            background: linear-gradient(135deg, #86efac 0%, #22c55e 50%, #15803d 100%);
            color: #052e16;
            border-color: #dcfce7;
            text-shadow: none;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.65);
        }

        .center-panel {
            background:
                radial-gradient(circle at 50% 42%, rgba(250, 204, 21, 0.12) 0%, transparent 68%),
                linear-gradient(180deg, rgba(13, 29, 58, 0.98) 0%, rgba(4, 9, 20, 0.99) 100%);
            border: 1px solid rgba(125, 211, 252, 0.72);
            border-radius: 11px;
            padding: 4.5px 3.5px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 6px 14px rgba(0, 0, 0, 0.68);
        }

        .period-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2.5px;
            background: rgba(15, 23, 42, 0.94);
            padding: 1.5px 4px;
            border-radius: 4.5px;
            width: 100%;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        .period-display {
            font-size: 6.2px;
            color: #f8fafc;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .live-dot {
            width: 4.5px;
            height: 4.5px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 6px #22c55e, 0 0 10px #4ade80;
            flex-shrink: 0;
            animation: liveBlink 1.2s ease-in-out infinite;
        }

        @keyframes liveBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.82); }
        }

        /* ফুটবল-রেক + লাল-সাদা চক্কর রিং সহ মেইন অর্ব */
        .football-orb-wrap {
            position: relative;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 2px 0;
        }

        .red-white-rack-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: repeating-conic-gradient(
                from 0deg,
                #ef4444 0deg 22.5deg,
                #ffffff 22.5deg 45deg
            );
            box-shadow:
                0 0 12px rgba(239, 68, 68, 0.7),
                0 0 16px rgba(255, 255, 255, 0.35),
                0 6px 12px rgba(0, 0, 0, 0.85);
            animation: rackSpinSlow 5s linear infinite;
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #000 calc(100% - 3.8px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #000 calc(100% - 3.8px));
        }

        @keyframes rackSpinSlow {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .glow-orb {
            position: relative;
            font-family: 'Chakra Petch', sans-serif;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 1),
                0 2px 0 #090d16,
                0 0 8px rgba(0, 0, 0, 0.95);
            border: 1.5px solid #ffffff;
            overflow: hidden;
            z-index: 2;
        }

        .glow-orb::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background:
                repeating-conic-gradient(
                    from 15deg,
                    rgba(255, 255, 255, 0.25) 0deg 14deg,
                    transparent 14deg 60deg
                ),
                radial-gradient(circle at 50% 50%, transparent 32%, rgba(255, 255, 255, 0.36) 33.5%, transparent 35.5%),
                radial-gradient(circle at 28% 24%, rgba(255, 255, 255, 0.45), transparent 55%);
            pointer-events: none;
            z-index: 1;
        }

        .glow-orb span {
            position: relative;
            z-index: 2;
        }

        .orb-green {
            background: radial-gradient(circle at 30% 22%, #86efac 0%, #22c55e 45%, #15803d 78%, #052e16 100%);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.85), 0 0 14px rgba(34, 197, 94, 0.85), inset 0 2px 5px rgba(255, 255, 255, 0.45);
        }

        .orb-red {
            background: radial-gradient(circle at 30% 22%, #fca5a5 0%, #ef4444 45%, #b91c1c 78%, #450a0a 100%);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.85), 0 0 14px rgba(239, 68, 68, 0.88), inset 0 2px 5px rgba(255, 255, 255, 0.45);
        }

        .orb-violet {

            if (!("speechSynthesis" in window)) return null;
            const voices = window.speechSynthesis.getVoices() || [];
            const banglaVoices = voices.filter((v) => /bn/i.test(v.lang) || /bangla|bengali/i.test(v.name));
            const maleKeywords = /male|man|rishi|prabhat|tariq|hasan|karim|bd/i;

            if (banglaMale) return banglaMale;
            if (banglaVoices.length > 0) return banglaVoices[0];

            const anyMale = voices.find((v) => maleKeywords.test(v.name));

            const secInDay = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();

            const rem = secInDay % cfg.duration;

            x = Math.imul(x, 0x7feb352d) >>> 0;

            x = Math.imul(x, 0x846ca68b) >>> 0;

                const pIsBig = (pHash % 100) >= 49;
                if (pIsBig) bigCount++;

                if (lookback === 1) {
                    prevStreakType = pIsBig ? "BIG" : "SMALL";
                    streakCount = 1;
                } else if (((pIsBig ? "BIG" : "SMALL") === prevStreakType) && streakCount === lookback - 1) {
                    streakCount++;
                }
            }

            let bigScore = h1 % 100;

            if (prevStreakType === "BIG" && streakCount >= 3) {
                bigScore -= 18;
            } else if (prevStreakType === "SMALL" && streakCount >= 3) {
                bigScore += 18;
            }

            if (bigCount >= 4) bigScore -= 10;
            if (bigCount <= 1) bigScore += 10;

            const type = bigScore >= 50 ? "BIG" : "SMALL";

            const poolSmall = [0, 1, 2, 3, 4];
            const poolBig = [5, 6, 7, 8, 9];
            const pool = type === "BIG" ? poolBig : poolSmall;

            let pickIdx = h2 % pool.length;
            let num = pool[pickIdx];

            if (slotNum > 1) {
                const prevNum = evaluateSlotRawNum(slotNum - 1, cfg, dateSeed);
                if (num === prevNum) {
                    num = pool[(pickIdx + 1) % pool.length];
                }
            }

            const delta = Math.abs(bigScore - 50);
            const confidence = Math.min(94, Math.max(76, 78 + Math.floor(delta * 0.65) + (h2 % 6)));
            const meta = getColorMeta(num);

            return { type, num, confidence, ...meta };
        }

        function evaluateSlotRawNum(slotNum, cfg, dateSeed) {
            const baseSeed = (dateSeed ^ Math.imul(slotNum, cfg.salt)) >>> 0;
            const h1 = mixHash(baseSeed);
            const h2 = mixHash(h1 ^ (slotNum * 2654435761));
            const type = (h1 % 100) >= 50 ? "BIG" : "SMALL";
            const pool = type === "BIG" ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
            return pool[h2 % pool.length];
        }

        function renderRecentWheels(cfg, periodIndexToday, dateSeed) {
            const container = document.getElementById('recent-wheels');
            container.innerHTML = "";
            for (let i = 9; i >= 0; i--) {
                const idx = Math.max(1, periodIndexToday - i);
                const sig = evaluateSlot(idx, cfg, dateSeed);

                const el = document.createElement('div');
                el.className = `color-wheel ${sig.wheelClass}`;
                el.innerHTML = `<span>${sig.num}</span>`;
                container.appendChild(el);
            }
        }

        function updateSignalLogic() {
            if (!isUnlocked) return;

            const cfg = MARKETS[currentMarket] || MARKETS["30S"];
            const now = new Date();
            const { elapsed, timeLeft, periodIndexToday } = getSyncedMarketClock(currentMarket, cfg, now);

            const dateStr = `${now.getUTCFullYear()}${String(now.getUTCMonth() + 1).padStart(2, '0')}${String(now.getUTCDate()).padStart(2, '0')}`;
            const dateSeed = parseInt(dateStr, 10) || 20261121;
            const formattedIndex = String(cfg.offset + periodIndexToday).padStart(5, '0');
            const fullPeriod = `${dateStr}1000${formattedIndex}`;

            document.getElementById('period-num').innerText = fullPeriod;
            document.getElementById('timer-display').innerText = `NEXT IN ${String(timeLeft).padStart(2, '0')}s`;

            if (fullPeriod !== cachedPeriod) {
                cachedPeriod = fullPeriod;
                cachedPrediction = evaluateSlot(periodIndexToday, cfg, dateSeed);
            }

            const orb = document.getElementById('main-orb');
            const orbText = document.getElementById('main-orb-text');
            const smallPanel = document.getElementById('small-panel');
            const bigPanel = document.getElementById('big-panel');
            const smallTag = document.getElementById('small-tag');
            const bigTag = document.getElementById('big-tag');
            const confLabel = document.getElementById('conf-label');

            if (elapsed <= 2) {
                orbText.innerText = "...";
                orb.className = "glow-orb orb-violet";
                document.getElementById('color-label').innerText = "SCANNING";
                confLabel.innerText = "SYNC...";
                smallPanel.classList.remove('is-predicted');
                bigPanel.classList.remove('is-predicted');
                smallTag.innerText = "WAIT";
                bigTag.innerText = "WAIT";
                smallTag.className = "panel-tag text-3d";
                bigTag.className = "panel-tag text-3d";
            } else {
                orbText.innerText = String(cachedPrediction.num);
                orb.className = `glow-orb ${cachedPrediction.orbClass}`;
                document.getElementById('color-label').innerText = cachedPrediction.colorName;
                confLabel.innerText = `CONF ${cachedPrediction.confidence}%`;

                if (cachedPrediction.type === "BIG") {
                    bigPanel.classList.add('is-predicted');
                    smallPanel.classList.remove('is-predicted');
                    bigTag.innerText = "PREDICTED";
                    bigTag.className = "panel-tag text-3d active-tag";
                    smallTag.innerText = "SKIP";
                    smallTag.className = "panel-tag text-3d";
                } else {
                    smallPanel.classList.add('is-predicted');
                    bigPanel.classList.remove('is-predicted');
                    smallTag.innerText = "PREDICTED";
                    smallTag.className = "panel-tag text-3d active-tag";
                    bigTag.innerText = "SKIP";
                    bigTag.className = "panel-tag text-3d";
                }

                if (lastSpokenPeriod !== fullPeriod) {
                    lastSpokenPeriod = fullPeriod;
                    announcePredictionBangla(cachedPrediction);
                }
            }

            renderRecentWheels(cfg, periodIndexToday, dateSeed);
        }

        if ("speechSynthesis" in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                pickMaleBanglaVoice();
            };
        }

        makeDraggable(document.getElementById("floating-icon-btn"), document.getElementById("floating-icon-btn"), handleIconClick);
        makeDraggable(document.getElementById("main-content"), document.getElementById("main-content-header"), null);

        function makeDraggable(targetEl, handleEl, onTap) {
            let isDown = false;
            let moved = false;
            let startX = 0, startY = 0, origLeft = 0, origTop = 0;

            function onStart(x, y) {
                const rect = targetEl.getBoundingClientRect();
                origLeft = rect.left;
                origTop = rect.top;
                startX = x;
                startY = y;
                isDown = true;
                moved = false;
                targetEl.style.left = `${origLeft}px`;
                targetEl.style.top = `${origTop}px`;
                targetEl.style.right = "auto";
                targetEl.style.bottom = "auto";
                targetEl.style.transform = "none";
            }

            function onMove(x, y) {
                if (!isDown) return;
                const dx = x - startX;
                const dy = y - startY;
                if (Math.hypot(dx, dy) > 6) moved = true;
                const maxLeft = Math.max(4, window.innerWidth - targetEl.offsetWidth - 4);
                const maxTop = Math.max(4, window.innerHeight - targetEl.offsetHeight - 4);
                targetEl.style.left = `${Math.max(4, Math.min(maxLeft, origLeft + dx))}px`;
                targetEl.style.top = `${Math.max(4, Math.min(maxTop, origTop + dy))}px`;
            }

            function onEnd() {
                if (!isDown) return;
                isDown = false;
                if (!moved && typeof onTap === "function") onTap();
            }

            handleEl.addEventListener("touchstart", (e) => {
                if (e.target.closest("button") || e.target.closest("a")) return;
                if (e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });

            handleEl.addEventListener("touchmove", (e) => {
                if (!isDown || e.touches.length !== 1) return;
                e.preventDefault();
                onMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });

            handleEl.addEventListener("touchend", onEnd);
            handleEl.addEventListener("touchcancel", onEnd);

            handleEl.addEventListener("mousedown", (e) => {
                if (e.button !== 0 || e.target.closest("button") || e.target.closest("a")) return;
                onStart(e.clientX, e.clientY);

                function mm(ev) { onMove(ev.clientX, ev.clientY); }
                function mu() {
                    document.removeEventListener("mousemove", mm);
                    document.removeEventListener("mouseup", mu);
                    onEnd();
                }
                document.addEventListener("mousemove", mm);
                document.addEventListener("mouseup", mu);
            });
        }
    </script>
