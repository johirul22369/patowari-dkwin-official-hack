<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PATOWARI'S HACK - 3D VIP Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #02050c;
            color: #ffffff;
        }

        #game-iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* ৩ডি ফ্লোটিং আইকন */
        #floating-icon-btn {
            position: fixed;
            top: 80px;
            right: 14px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid #facc15;
            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.85),
                0 0 16px rgba(250, 204, 21, 0.55),
                inset 0 2px 5px rgba(255, 255, 255, 0.35);
            cursor: grab;
            z-index: 9999;
            overflow: hidden;
            touch-action: none;
            background: radial-gradient(circle at 30% 25%, #1e3a8a, #050a14);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.16s ease;
        }

        #floating-icon-btn:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        #floating-icon-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* পাসওয়ার্ড পপআপ */
        #auth-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 230px;
            background: linear-gradient(155deg, rgba(22, 48, 94, 0.98) 0%, rgba(5, 11, 24, 0.99) 100%);
            border: 1.5px solid rgba(250, 204, 21, 0.8);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.92), 0 0 22px rgba(34, 211, 238, 0.25);
            padding: 12px;
            display: none;
            z-index: 10000;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .auth-title {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #facc15;
            margin-bottom: 8px;
            letter-spacing: 0.6px;
        }

        .auth-input {
            width: 100%;
            padding: 7px 9px;
            background: rgba(3, 8, 18, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.7);
            border-radius: 8px;
            color: #ffffff;
            font-size: 11px;
            text-align: center;
            margin-bottom: 8px;
            outline: none;
            font-weight: 700;
            user-select: text;
            -webkit-user-select: text;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 9px;
            color: #cbd5e1;
            margin-bottom: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-btn {
            font-family: 'Chakra Petch', sans-serif;
            width: 100%;
            padding: 7px;
            background: linear-gradient(135deg, #facc15, #eab308);
            border: none;
            border-radius: 8px;
            color: #050912;
            font-size: 10.5px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        #error-msg {
            color: #fb7185;
            font-size: 9px;
            margin-top: 6px;
            display: none;
            font-weight: 700;
        }

        /* ছোট ও কমপ্যাক্ট ৩ডি পপআপ কার্ড (~218px) */
        .overlay-box {
            position: fixed;
            top: 95px;
            left: 12px;
            width: 218px;
            max-width: calc(100vw - 16px);
            display: none;
            z-index: 9999;
            background: radial-gradient(circle at 50% -10%, #1d4282 0%, #09152b 52%, #040914 100%);
            border-radius: 16px;
            padding: 7px;
            box-shadow:
                0 16px 36px rgba(0, 0, 0, 0.92),
                0 0 20px rgba(34, 211, 238, 0.28),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
            border: 1.5px solid rgba(56, 189, 248, 0.72);
            backdrop-filter: blur(10px);
        }

        .popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            margin-bottom: 5px;
            cursor: grab;
            touch-action: none;
        }

        .popup-header:active {
            cursor: grabbing;
        }

        .badge-left {
            font-family: 'Chakra Petch', sans-serif;
            background: linear-gradient(135deg, #4ade80, #16a34a);
            color: #042812;
            font-size: 6.5px;
            font-weight: 700;
            padding: 2px 4px;
            border-radius: 5px;
            line-height: 1.05;
            text-transform: uppercase;
            pointer-events: none;
        }

        .brand-center {
            text-align: center;
            flex: 1;
            pointer-events: none;
        }

        .brand-main {
            font-family: 'Chakra Petch', sans-serif;
            font-style: italic;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.4px;
            background: linear-gradient(90deg, #fef08a, #38bdf8, #4ade80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .brand-sub {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 6.5px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.3px;
            margin-top: 1px;
        }

        .hide-btn {
            font-family: 'Chakra Petch', sans-serif;
            background: rgba(15, 23, 42, 0.92);
            color: #f8fafc;
            border: 1px solid rgba(56, 189, 248, 0.45);
            padding: 2px 5px;
            border-radius: 5px;
            font-size: 6.5px;
            font-weight: 700;
            cursor: pointer;
        }

        /* ৪টি মার্কেট ট্যাব: 30S, 1M, 3M, 5M */
        .market-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2.5px;
            margin-bottom: 5px;
            background: rgba(4, 9, 19, 0.92);
            padding: 2px;
            border-radius: 7px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .market-btn {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 7px;
            font-weight: 700;
            padding: 2.5px 1px;
            border-radius: 5px;
            border: 1px solid transparent;
            background: rgba(15, 23, 42, 0.85);
            color: #cbd5e1;
            cursor: pointer;
            text-align: center;
        }

        .market-btn.active {
            background: linear-gradient(135deg, #06b6d4, #2563eb);
            color: #ffffff;
            border-color: #a5f3fc;
        }

        /* বামে SMALL, মাঝে PERIOD + 3D ORB, ডানে BIG */
        .pred-grid {
            display: grid;
            grid-template-columns: 0.92fr 1.26fr 0.92fr;
            gap: 4px;
            align-items: stretch;
            position: relative;
        }

        .side-panel {
            border-radius: 10px;
            padding: 5px 3px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .panel-small {
            background: linear-gradient(165deg, rgba(14, 165, 233, 0.45) 0%, rgba(7, 38, 60, 0.95) 100%);
        }

        .panel-big {
            background: linear-gradient(165deg, rgba(236, 72, 153, 0.42) 0%, rgba(68, 5, 24, 0.95) 100%);
        }

        .side-panel.is-predicted {
            border-color: #4ade80;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.45);
        }

        .side-panel > div {
            position: relative;
            z-index: 2;
        }

        /* নিচ থেকে উপরের দিকে ছুটে যাওয়া রকেট */
        .firecracker-rocket {
            position: absolute;
            left: 50%;
            bottom: 3px;
            width: 3px;
            height: 11px;
            border-radius: 999px;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #ffffff 0%, #38bdf8 50%, #f472b6 100%);
            box-shadow: 0 0 8px #38bdf8, 0 0 15px #f472b6;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            animation: rocketAscendBlast 2.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        }

        .panel-big .firecracker-rocket {
            animation-delay: 1.05s;
        }

        @keyframes rocketAscendBlast {
            0%   { opacity: 0; bottom: 2px; height: 9px; transform: translateX(-50%) scale(0.9); }
            12%  { opacity: 1; bottom: 8px; height: 12px; transform: translateX(-50%) scale(1); }
            62%  { opacity: 1; bottom: calc(100% - 17px); height: 7px; transform: translateX(-50%) scale(1.05); }
            67%  { opacity: 0; bottom: calc(100% - 14px); height: 2px; transform: translateX(-50%) scale(0.4); }
            100% { opacity: 0; bottom: 2px; height: 9px; transform: translateX(-50%) scale(0.9); }
        }

        /* উপরে গিয়ে ফেটে চারদিকে আলো ছড়ানোর মূল বিস্ফোরণ */
        .firecracker-burst {
            position: absolute;
            left: 50%;
            top: 13px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.15);
            background: radial-gradient(circle, #ffffff 0%, #38bdf8 38%, #f472b6 70%, transparent 100%);
            box-shadow:
                0 0 14px #ffffff,
                0 0 24px #38bdf8,
                -11px -9px 6px #facc15,
                11px -9px 6px #38bdf8,
                -13px 2px 6px #f472b6,
                13px 2px 6px #4ade80,
                -8px 10px 6px #38bdf8,
                8px 10px 6px #facc15,
                0 -13px 6px #ffffff,
                0 12px 6px #f472b6;
            opacity: 0;
            pointer-events: none;
            z-index: 4;
            animation: thashLightScatter 2.1s ease-out infinite;
        }

        .panel-big .firecracker-burst {
            animation-delay: 1.05s;
        }

        @keyframes thashLightScatter {
            0%, 64% { opacity: 0; transform: translate(-50%, -50%) scale(0.15); }
            68%       { opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
            82%       { opacity: 0.9; transform: translate(-50%, -50%) scale(1.85); }
            100%      { opacity: 0; transform: translate(-50%, -50%) scale(2.35); }
        }

        /* বিস্ফোরণের বাড়তি ছড়ানো ফুলকি রিং */
        .firecracker-sparks {
            position: absolute;
            left: 50%;
            top: 13px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.1);
            box-shadow:
                -16px -4px 4px #facc15,
                16px -4px 4px #38bdf8,
                -6px -14px 4px #f472b6,
                6px -14px 4px #4ade80,
                -12px 7px 4px #38bdf8,
                12px 7px 4px #facc15,
                -4px 14px 4px #f472b6,
                4px 14px 4px #4ade80;
            opacity: 0;
            pointer-events: none;
            z-index: 4;
            animation: sparkOuterSpray 2.1s ease-out infinite;
        }

        .panel-big .firecracker-sparks {
            animation-delay: 1.05s;
        }

        @keyframes sparkOuterSpray {
            0%, 65% { opacity: 0; transform: translate(-50%, -50%) scale(0.1); }
            71%       { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            88%       { opacity: 0.65; transform: translate(-50%, -50%) scale(1.75); }
            100%      { opacity: 0; transform: translate(-50%, -50%) scale(2.15); }
        }

        /* মোটা, থ্রিডি এবং ভেতরে RGB লাইট জ্বলা SMALL ও BIG লেখা */
        .panel-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.5px;
            line-height: 1.1;
            transform: perspective(180px) rotateX(10deg);
            background: linear-gradient(90deg, #ff2a85, #fee440, #00f5d4, #9b5de5, #ff2a85);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 0.4px rgba(255, 255, 255, 0.35);
            filter:
                drop-shadow(0 1.5px 0px #09152b)
                drop-shadow(0 3px 0px rgba(0, 0, 0, 0.9))
                drop-shadow(0 0 7px rgba(0, 245, 212, 0.55));
            animation: rgbTextFlow 2.5s linear infinite;
        }

        @keyframes rgbTextFlow {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .panel-range {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 7px;
            color: #e2e8f0;
            opacity: 0.9;
            margin-top: 1.5px;
            font-weight: 700;
        }

        .panel-tag {
            font-family: 'Chakra Petch', sans-serif;
            margin-top: 5px;
            font-size: 6px;
            font-weight: 700;
            padding: 2px 2px;
            border-radius: 4px;
            background: rgba(15, 23, 42, 0.88);
            color: #94a3b8;
        }

        .panel-tag.active-tag {
            background: linear-gradient(135deg, #4ade80, #16a34a);
            color: #052e16;
        }

        .center-panel {
            background: linear-gradient(180deg, rgba(10, 22, 44, 0.96) 0%, rgba(4, 9, 20, 0.98) 100%);
            border: 1px solid rgba(56, 189, 248, 0.65);
            border-radius: 10px;
            padding: 4px 3px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .period-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: rgba(15, 23, 42, 0.85);
            padding: 1.5px 4px;
            border-radius: 4px;
            width: 100%;
        }

        .period-display {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 6.2px;
            font-weight: 700;
            color: #f8fafc;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .live-dot {
            width: 4px;
            height: 4px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 5px #22c55e;
            flex-shrink: 0;
        }

        /* পরিষ্কার ও স্পষ্ট নাম্বার অর্ব (Green / Red / Violet) */
        .glow-orb {
            font-family: 'Chakra Petch', sans-serif;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14.5px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow:
                0 6px 12px rgba(0, 0, 0, 0.75),
                inset 0 2px 4px rgba(255, 255, 255, 0.35);
            margin: 2px 0;
        }

        .orb-green {
            background: radial-gradient(circle at 30% 25%, #22c55e, #15803d 65%, #052e16 100%);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.75), 0 0 12px rgba(34, 197, 94, 0.65);
        }

        .orb-red {
            background: radial-gradient(circle at 30% 25%, #ef4444, #b91c1c 65%, #450a0a 100%);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.75), 0 0 12px rgba(239, 68, 68, 0.65);
        }

        .orb-violet {
            background: radial-gradient(circle at 30% 25%, #a855f7, #7e22ce 65%, #2e1065 100%);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.75), 0 0 12px rgba(168, 85, 247, 0.65);
        }

        .timer-pill {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 6.5px;
            font-weight: 700;
            color: #facc15;
            background: rgba(250, 204, 21, 0.14);
            border: 1px solid rgba(250, 204, 21, 0.32);
            padding: 1.5px 5px;
            border-radius: 999px;
            margin-top: 1px;
        }

        /* নিচের RECENT বাবল লাইন */
        .recent-box {
            margin-top: 5px;
            background: rgba(4, 10, 20, 0.94);
            border: 1px solid rgba(148, 163, 184, 0.24);
            border-radius: 8px;
            padding: 4px;
        }

        .recent-head {
            font-family: 'Chakra Petch', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 6.2px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 3px;
        }

        .wheel-strip {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            align-items: center;
        }

        .color-wheel {
            font-family: 'Chakra Petch', sans-serif;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .w-green { background: conic-gradient(#16a34a 0deg 270deg, #22c55e 270deg 360deg); }
        .w-red { background: conic-gradient(#dc2626 0deg 270deg, #ef4444 270deg 360deg); }
        .w-violet-green { background: conic-gradient(#9333ea 0deg 180deg, #16a34a 180deg 360deg); }
        .w-violet-red { background: conic-gradient(#9333ea 0deg 180deg, #dc2626 180deg 360deg); }

        .bottom-action-bar {
            margin-top: 5px;
            width: 100%;
        }

        .telegram-join-btn {
            font-family: 'Chakra Petch', sans-serif;
            width: 100%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #052e16;
            border-radius: 7px;
            padding: 4.5px 7px;
            font-size: 7px;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-transform: uppercase;
        }

        #copy-toast {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: #ffffff;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 5px;
            display: none;
            z-index: 10002;
        }
    </style>
</head>
<body>

    <!-- গেম রেফারেল লিংক iframe -->
    <iframe id="game-iframe" src="https://dkwin9.com/#/register?invitationCode=932152417441" loading="lazy"></iframe>

    <!-- ৩ডি ফ্লোটিং আইকন -->
    <div id="floating-icon-btn">

    </div>

    <!-- পাসওয়ার্ড পপআপ -->
    <div id="auth-overlay">
        <div class="auth-title">🔐 PATOWARI'S HACK</div>
        <input type="password" id="pass-input" class="auth-input" placeholder="Enter Password" />
        <label class="remember-row">
            <input type="checkbox" id="remember-pass" /> Remember Password
        </label>
        <button type="button" class="auth-btn" onclick="checkPassword()">Submit</button>
        <div id="error-msg">Wrong Password!</div>
    </div>

    <!-- ছোট ৩ডি পপআপ উইন্ডো (~218px) -->
    <div class="overlay-box" id="main-content">
        <div class="popup-header" id="main-content-header">
            <div class="badge-left">3D<br />VIP</div>
            <div class="brand-center">
                <div class="brand-main">PATOWARI'S HACK</div>
                <div class="brand-sub" id="mode-subtitle">30 SEC PREDICTOR V2</div>
            </div>
            <button type="button" class="hide-btn" onclick="hidePopup()">HIDE</button>
        </div>

        <!-- ৪টি মার্কেট: 30S, 1M, 3M, 5M -->
        <div class="market-tabs">
            <button type="button" class="market-btn active" data-market="30S">30S</button>
            <button type="button" class="market-btn" data-market="1M">1M</button>
            <button type="button" class="market-btn" data-market="3M">3M</button>
            <button type="button" class="market-btn" data-market="5M">5M</button>
        </div>

        <div class="pred-grid">
            <div class="side-panel panel-small" id="small-panel">
                <span class="firecracker-rocket"></span>
                <span class="firecracker-burst"></span>
                <span class="firecracker-sparks"></span>
                <div>
                    <div class="panel-title">SMALL</div>
                    <div class="panel-range">0 - 4</div>
                </div>
                <div class="panel-tag" id="small-tag">STANDBY</div>
            </div>

            <div class="center-panel">
                <div class="period-row">
                    <div class="period-display" id="period-num" onclick="copyPeriodNumber()" title="Click to Copy Period">Loading...</div>
                    <div class="live-dot"></div>
                </div>
                <div class="glow-orb orb-green" id="main-orb">-</div>
                <div class="timer-pill" id="timer-display">NEXT IN 30s</div>
            </div>

            <div class="side-panel panel-big" id="big-panel">
                <span class="firecracker-rocket"></span>
                <span class="firecracker-burst"></span>
                <span class="firecracker-sparks"></span>
                <div>
                    <div class="panel-title">BIG</div>
                    <div class="panel-range">5 - 9</div>
                </div>
                <div class="panel-tag" id="big-tag">STANDBY</div>
            </div>
        </div>

        <div class="recent-box">
            <div class="recent-head">
                <span>RECENT</span>
                <span id="color-label">GREEN</span>
            </div>
            <div class="wheel-strip" id="recent-wheels"></div>
        </div>

        <div class="bottom-action-bar">
            <a href="https://t.me/patowari_vai_69x" target="_blank" rel="noopener noreferrer" class="telegram-join-btn">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.693-1.653-1.124-2.678-1.8-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.329-.913.489-1.302.481-.428-.009-1.252-.242-1.865-.442-752-.244-1.349-.374-1.297-.789.027-.216.324-.437.893-.663 3.498-1.524 5.83-2.529 6.996-3.014 3.333-1.386 4.025-1.627 4.479-1.635.099-.002.321.023.465.14.12.098.153.228.166.32.013.092.028.301.012.463z" fill="#052e16"/>
                </svg>
                JOIN TELEGRAM
            </a>
        </div>
    </div>

    <div id="copy-toast">Copied!</div>

    <script>
        const MARKETS = {
            "30S": { duration: 30,  offset: 50000, label: "30 SEC PREDICTOR V2" },
            "1M":  { duration: 60,  offset: 20000, label: "1 MIN PREDICTOR V2" },
            "3M":  { duration: 180, offset: 10000, label: "3 MIN PREDICTOR V2" },
            "5M":  { duration: 300, offset: 5000,  label: "5 MIN PREDICTOR V2" }
        };

        let currentMarket = "30S";
        let isUnlocked = localStorage.getItem("patowari_hack_unlocked") === "true";
        let cachedPeriod = "";
        let cachedPrediction = { type: "BIG", num: 7 };
        let signalTimerStarted = false;

        document.querySelectorAll(".market-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".market-btn").forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");
                currentMarket = btn.dataset.market;
                document.getElementById("mode-subtitle").innerText = MARKETS[currentMarket].label;
                cachedPeriod = "";
                updateSignalLogic();
            });
        });

        function handleIconClick() {
            if (isUnlocked) {
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('floating-icon-btn').style.display = 'none';
                startPeriodGenerator();
            } else {
                document.getElementById('error-msg').style.display = 'none';
                document.getElementById('auth-overlay').style.display = 'block';
            }
        }

        function checkPassword() {
            const pass = document.getElementById('pass-input').value.trim();
            const rememberMe = document.getElementById('remember-pass').checked;

            if (pass === "PATOWARI69") {
                isUnlocked = true;
                if (rememberMe) {
                    localStorage.setItem("patowari_hack_unlocked", "true");
                }
                document.getElementById('error-msg').style.display = 'none';
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('floating-icon-btn').style.display = 'none';
                startPeriodGenerator();
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('pass-input').value = "";
            }
        }

        function hidePopup() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('floating-icon-btn').style.display = 'flex';
        }

        function startPeriodGenerator() {
            updateSignalLogic();
            if (!signalTimerStarted) {
                signalTimerStarted = true;
                setInterval(updateSignalLogic, 1000);
            }
        }

        function copyPeriodNumber() {
            const periodText = document.getElementById('period-num').innerText.trim();
            if (periodText && periodText !== "Loading...") {
                navigator.clipboard.writeText(periodText).then(() => {
                    const toast = document.getElementById('copy-toast');
                    toast.style.display = 'block';
                    setTimeout(() => {
                        toast.style.display = 'none';
                    }, 1200);
                }).catch(() => {});
            }
        }

        function getSyncedMarketClock(marketKey, cfg, now) {
            const secInDay = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();

            if (marketKey === "1M") {
                const secInMin = now.getUTCSeconds();
                const timeLeft = 60 - secInMin;
                const elapsed = 60 - timeLeft;
                const periodIndexToday = Math.floor(secInDay / 60) + 1;
                return { elapsed, timeLeft, periodIndexToday };
            }

            if (marketKey === "3M") {
                const slot = Math.floor(secInDay / 180);
                const rem = secInDay % 180;
                const timeLeft = 180 - rem;
                const elapsed = 180 - timeLeft;
                const periodIndexToday = slot + 1;
                return { elapsed, timeLeft, periodIndexToday };
            }

            if (marketKey === "5M") {
                const slot = Math.floor(secInDay / 300);
                const rem = secInDay % 300;
                const timeLeft = 300 - rem;
                const elapsed = 300 - timeLeft;
                const periodIndexToday = slot + 1;
                return { elapsed, timeLeft, periodIndexToday };
            }

            const rem = secInDay % 30;
            const timeLeft = 30 - rem;
            const elapsed = 30 - timeLeft;
            const periodIndexToday = Math.floor(secInDay / 30) + 1;
            return { elapsed, timeLeft, periodIndexToday };
        }

        function computeSignalFromTail(tailNum, slotNum) {
            const trend = (tailNum * 31 + slotNum) % 100;
            const isBig = trend >= 46;
            const type = isBig ? "BIG" : "SMALL";
            const num = isBig
                ? 5 + ((tailNum + trend) % 5)
                : (tailNum + trend) % 5;

            let orbClass = "orb-red";
            let wheelClass = "w-red";
            let colorName = "RED";

            if (num === 0) {
                orbClass = "orb-violet";
                wheelClass = "w-violet-red";
                colorName = "VIOLET + RED";
            } else if (num === 5) {
                orbClass = "orb-violet";
                wheelClass = "w-violet-green";
                colorName = "VIOLET + GREEN";
            } else if ([1, 3, 7, 9].includes(num)) {
                orbClass = "orb-green";
                wheelClass = "w-green";
                colorName = "GREEN";
            }

            return { type, num, orbClass, wheelClass, colorName };
        }

        function renderRecentWheels(cfg, periodIndexToday) {
            const container = document.getElementById('recent-wheels');
            container.innerHTML = "";
            for (let i = 9; i >= 0; i--) {
                const idx = Math.max(1, periodIndexToday - i);
                const seq = String(cfg.offset + idx).padStart(5, '0');
                const tail = parseInt(seq, 10) || (cfg.offset + 1);
                const sig = computeSignalFromTail(tail, idx);

                const el = document.createElement('div');
                el.className = `color-wheel ${sig.wheelClass}`;
                el.textContent = String(sig.num);
                container.appendChild(el);
            }
        }

        function updateSignalLogic() {
            if (!isUnlocked) return;

            const cfg = MARKETS[currentMarket] || MARKETS["30S"];
            const now = new Date();
            const { elapsed, timeLeft, periodIndexToday } = getSyncedMarketClock(currentMarket, cfg, now);

            const dateStr = `${now.getUTCFullYear()}${String(now.getUTCMonth() + 1).padStart(2, '0')}${String(now.getUTCDate()).padStart(2, '0')}`;
            const formattedIndex = String(cfg.offset + periodIndexToday).padStart(5, '0');
            const fullPeriod = `${dateStr}1000${formattedIndex}`;

            document.getElementById('period-num').innerText = fullPeriod;
            document.getElementById('timer-display').innerText = `NEXT IN ${String(timeLeft).padStart(2, '0')}s`;

            if (fullPeriod !== cachedPeriod) {
                cachedPeriod = fullPeriod;
                const seedVal = parseInt(fullPeriod.slice(-5), 10) || 12345;
                cachedPrediction = computeSignalFromTail(seedVal, periodIndexToday);
            }

            const orb = document.getElementById('main-orb');
            const smallPanel = document.getElementById('small-panel');
            const bigPanel = document.getElementById('big-panel');
            const smallTag = document.getElementById('small-tag');
            const bigTag = document.getElementById('big-tag');

            if (elapsed <= 2) {
                orb.innerText = "...";
                orb.className = "glow-orb orb-violet";
                document.getElementById('color-label').innerText = "WAIT";
                smallPanel.classList.remove('is-predicted');
                bigPanel.classList.remove('is-predicted');
                smallTag.innerText = "WAIT";
                bigTag.innerText = "WAIT";
                smallTag.className = "panel-tag";
                bigTag.className = "panel-tag";
            } else {
                orb.innerText = String(cachedPrediction.num);
                orb.className = `glow-orb ${cachedPrediction.orbClass}`;
                document.getElementById('color-label').innerText = cachedPrediction.colorName;

                if (cachedPrediction.type === "BIG") {
                    bigPanel.classList.add('is-predicted');
                    smallPanel.classList.remove('is-predicted');
                    bigTag.innerText = "PREDICTED";
                    bigTag.className = "panel-tag active-tag";
                    smallTag.innerText = "SKIP";
                    smallTag.className = "panel-tag";
                } else {
                    smallPanel.classList.add('is-predicted');
                    bigPanel.classList.remove('is-predicted');
                    smallTag.innerText = "PREDICTED";
                    smallTag.className = "panel-tag active-tag";
                    bigTag.innerText = "SKIP";
                    bigTag.className = "panel-tag";
                }
            }

            renderRecentWheels(cfg, periodIndexToday);
        }

        makeDraggable(document.getElementById("floating-icon-btn"), document.getElementById("floating-icon-btn"), handleIconClick);
        makeDraggable(document.getElementById("main-content"), document.getElementById("main-content-header"), null);

        function makeDraggable(targetEl, handleEl, onTap) {
            let isDown = false;
            let moved = false;
            let startX = 0, startY = 0, origLeft = 0, origTop = 0;

            function onStart(x, y) {
                const rect = targetEl.getBoundingClientRect();
                origLeft = rect.left;
                origTop = rect.top;
                startX = x;
                startY = y;
                isDown = true;
                moved = false;
                targetEl.style.left = `${origLeft}px`;
                targetEl.style.top = `${origTop}px`;
                targetEl.style.right = "auto";
                targetEl.style.bottom = "auto";
                targetEl.style.transform = "none";
            }

            function onMove(x, y) {
                if (!isDown) return;
                const dx = x - startX;
                const dy = y - startY;
                if (Math.hypot(dx, dy) > 6) moved = true;
                const maxLeft = Math.max(4, window.innerWidth - targetEl.offsetWidth - 4);
                const maxTop = Math.max(4, window.innerHeight - targetEl.offsetHeight - 4);
                targetEl.style.left = `${Math.max(4, Math.min(maxLeft, origLeft + dx))}px`;
                targetEl.style.top = `${Math.max(4, Math.min(maxTop, origTop + dy))}px`;
            }

            function onEnd() {
                if (!isDown) return;
                isDown = false;
                if (!moved && typeof onTap === "function") onTap();
            }

            handleEl.addEventListener("touchstart", (e) => {
                if (e.target.closest("button") || e.target.closest("a")) return;
                if (e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });

            handleEl.addEventListener("touchmove", (e) => {
                if (!isDown || e.touches.length !== 1) return;
                e.preventDefault();
                onMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });

            handleEl.addEventListener("touchend", onEnd);
            handleEl.addEventListener("touchcancel", onEnd);

            handleEl.addEventListener("mousedown", (e) => {
                if (e.button !== 0 || e.target.closest("button") || e.target.closest("a")) return;
                onStart(e.clientX, e.clientY);

                function mm(ev) { onMove(ev.clientX, ev.clientY); }
                function mu() {
                    document.removeEventListener("mousemove", mm);
                    document.removeEventListener("mouseup", mu);
                    onEnd();
                }
                document.addEventListener("mousemove", mm);
                document.addEventListener("mouseup", mu);
            });
        }
    </script>
